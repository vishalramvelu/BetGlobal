{# Fallback wrapper for the Flask-Security views that have no bespoke page
   of their own (change password, confirmation instructions, and friends). #}
{% extends "landing_base.html" %}

{% block content %}
<div class="centered-page">
    <div class="centered-card">
        <div class="card card-pad" style="padding:28px">
            {% block auth_content %}{% endblock %}
        </div>
        <div style="text-align:center;margin-top:16px;font-size:13px">
            <a href="{{ url_for('security.login') }}" style="color:var(--muted)">← Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
